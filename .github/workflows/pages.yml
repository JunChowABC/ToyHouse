name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare runtime-only site
        run: |
          mkdir -p _site/assets
          cp docs/index.html docs/game.js docs/styles.css _site/
          mkdir -p _site/assets/runtime-ui
          cp docs/assets/runtime-ui/*.webp _site/assets/runtime-ui/
          cp -R docs/assets/loading-v1 docs/assets/tool-dialog-v1 _site/assets/
      - name: Reject local development controls
        run: node scripts/verify-release-no-gm.mjs _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
