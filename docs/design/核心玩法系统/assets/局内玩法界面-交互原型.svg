  <rect width="1600" height="1400" fill="#f7f4f8"/><text x="60" y="58" class="title">局内玩法界面 · 竖屏低保真交互原型 v1.1</text>
  <text x="60" y="88" class="t">已同步第一夜兔子集中布局、底部三道具、右上暂停入口与条内 Combo。</text>
  <rect x="60" y="120" width="648" height="1152" rx="28" fill="#d8c6dc" stroke="#665d72" stroke-width="3"/>
  <rect x="78" y="138" width="612" height="105" rx="18" fill="#fff8f1" stroke="#cfb8c5"/>
  <text x="102" y="177" class="h">第一夜 · 1-4</text><text x="102" y="207" class="small">交错路径 · 68/68 只还没睡</text>
  <rect x="320" y="166" width="214" height="36" rx="18" fill="#e8dce8"/><rect x="320" y="166" width="158" height="36" rx="18" fill="#dfa0b8"/><text x="427" y="190" class="h" text-anchor="middle">连击 ×12</text>
  <rect x="608" y="153" width="58" height="58" rx="17" fill="#fff" stroke="#a98fa1" stroke-width="2"/><rect x="624" y="168" width="7" height="28" rx="3" fill="#69586f"/><rect x="642" y="168" width="7" height="28" rx="3" fill="#69586f"/>

  <rect x="78" y="258" width="612" height="843" rx="24" fill="#f8e8e6" stroke="#d1aeb9" stroke-width="2"/><text x="96" y="286" class="small">14×20 隐形网格 · 第一夜只使用 1×2 普通兔子</text>
  <path d="M78 430 h-16 M78 720 h-16 M690 500 h16 M690 890 h16 M250 258 v-16 M520 258 v-16 M330 1101 v16 M580 1101 v16" stroke="#8f7788" stroke-width="5"/>
  <rect x="124" y="310" width="520" height="746" rx="18" fill="none" stroke="#d8bfc7" stroke-dasharray="8 8"/><text x="384" y="1042" class="small" text-anchor="middle">中央 10×14 密集区 · 四周留 2～3 格通道</text>
  <g>
    <use href="#rv" x="142" y="326"/><use href="#rv" x="190" y="326"/><use href="#rv" x="238" y="326"/><use href="#rv" x="286" y="326"/><use href="#rv" x="334" y="326"/><use href="#rv" x="382" y="326"/><use href="#rv" x="430" y="326"/><use href="#rv" x="478" y="326"/><use href="#rv" x="526" y="326"/><use href="#rv" x="574" y="326"/>
    <use href="#rv" x="142" y="426"/><use href="#rv" x="190" y="426"/><use href="#rv" x="238" y="426"/><use href="#rv" x="286" y="426"/><use href="#rv" x="334" y="426"/><use href="#rv" x="382" y="426"/><use href="#rv" x="430" y="426"/><use href="#rv" x="478" y="426"/><use href="#rv" x="526" y="426"/><use href="#rv" x="574" y="426"/>
    <use href="#rh" x="142" y="536"/><use href="#rh" x="244" y="536"/><use href="#rh" x="346" y="536"/><use href="#rh" x="448" y="536"/><use href="#rh" x="550" y="536"/>
    <use href="#rh" x="142" y="580"/><use href="#rh" x="244" y="580"/><use href="#rh" x="346" y="580"/><use href="#rh" x="448" y="580"/><use href="#rh" x="550" y="580"/>
    <use href="#rh" x="142" y="624"/><use href="#rh" x="244" y="624"/><use href="#rh" x="346" y="624"/><use href="#rh" x="448" y="624"/><use href="#rh" x="550" y="624"/>
    <use href="#rh" x="142" y="668"/><use href="#rh" x="244" y="668"/><use href="#rh" x="346" y="668"/><use href="#rh" x="448" y="668"/><use href="#rh" x="550" y="668"/>
    <use href="#rh" x="142" y="712"/><use href="#rh" x="244" y="712"/><use href="#rh" x="346" y="712"/><use href="#rh" x="448" y="712"/><use href="#rh" x="550" y="712"/>
    <use href="#rv" x="142" y="766" transform="rotate(180 159 812)"/><use href="#rv" x="190" y="766" transform="rotate(180 207 812)"/><use href="#rv" x="238" y="766" transform="rotate(180 255 812)"/><use href="#rv" x="286" y="766" transform="rotate(180 303 812)"/><use href="#rv" x="334" y="766" transform="rotate(180 351 812)"/><use href="#rv" x="382" y="766" transform="rotate(180 399 812)"/><use href="#rv" x="430" y="766" transform="rotate(180 447 812)"/><use href="#rv" x="478" y="766" transform="rotate(180 495 812)"/><use href="#rv" x="526" y="766" transform="rotate(180 543 812)"/><use href="#rv" x="574" y="766" transform="rotate(180 591 812)"/>
