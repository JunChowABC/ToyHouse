  <text x="64" y="112" class="sub">已同步：底部三道具、右上暂停、暂停弹窗、8 秒 Combo 冻结与恢复。</text>
  <rect x="64" y="150" width="960" height="900" rx="18" fill="#fcfafc" stroke="#e2dbe4"/><text x="92" y="190" class="h">正常主流程</text>
  <g><rect x="100" y="230" width="240" height="86" rx="14" fill="#fff0f4" stroke="#d786a3" stroke-width="2"/><rect x="116" y="246" width="64" height="24" rx="12" fill="#bd6686"/><text x="132" y="263" class="tag">外部</text><text x="116" y="292" class="h">玩具屋 / 关卡入口</text></g>
  <path class="line" d="M340 273 H416"/><text x="354" y="258" class="t">进入关卡</text>
  <g><rect x="416" y="230" width="240" height="86" rx="14" fill="#f0f3ff" stroke="#7888bd" stroke-width="2"/><rect x="432" y="246" width="64" height="24" rx="12" fill="#7888bd"/><text x="448" y="263" class="tag">状态</text><text x="432" y="292" class="h">关卡加载与盘面展示</text></g>
  <path class="line" d="M656 273 H732"/><text x="666" y="246" class="t">开局逻辑完成</text>
  <g><rect x="732" y="218" width="252" height="112" rx="14" fill="#eefaf6" stroke="#54a583" stroke-width="3"/><rect x="748" y="234" width="64" height="24" rx="12" fill="#3a8e70"/><text x="764" y="251" class="tag">主界面</text><text x="748" y="284" class="h">局内玩法主界面</text><text x="748" y="308" class="t">盘面、Combo、三道具、暂停</text></g>
  <g><rect x="100" y="400" width="300" height="142" rx="14" fill="#fff0f4" stroke="#d786a3" stroke-width="2"/><rect x="116" y="416" width="64" height="24" rx="12" fill="#bd6686"/><text x="132" y="433" class="tag">弹窗</text><text x="116" y="468" class="h">暂停弹窗</text><text x="116" y="494" class="t">音乐 / 音效 / 震动</text><text x="116" y="518" class="t">重新开始 / 继续 / 退出</text></g>
  <path class="line" d="M732 270 C590 270 565 456 400 456"/><text x="500" y="365" class="t">点击右上【暂停】</text><path class="line" d="M400 506 C570 590 662 386 770 330"/><text x="492" y="560" class="t">继续：返回原盘面与冻结点</text><path class="line" d="M100 470 H76 V273 H100"/><text x="80" y="382" class="t">退出</text>
  <g><rect x="430" y="625" width="284" height="126" rx="14" fill="#f3effc" stroke="#8d75bf" stroke-width="2"/><rect x="446" y="641" width="76" height="24" rx="12" fill="#8067b3"/><text x="458" y="658" class="tag">同屏状态</text><text x="446" y="693" class="h">后续关卡：小鸭自动连锁</text><text x="446" y="719" class="t">玩具、三道具、暂停入口锁定</text><text x="446" y="741" class="t">逻辑逐轮结算，动画可并行</text></g>
  <path class="line" d="M826 330 C826 482 696 542 630 625"/><text x="700" y="526" class="t">占格变化</text><path class="line" d="M714 684 C842 684 880 490 880 330"/><text x="748" y="658" class="t">逻辑连锁结束</text>
  <g><rect x="100" y="820" width="300" height="126" rx="14" fill="#fff8e9" stroke="#d9a13d" stroke-width="2"/><rect x="116" y="836" width="64" height="24" rx="12" fill="#c18a29"/><text x="132" y="853" class="tag">分支</text><text x="116" y="888" class="h">暂停内【重新开始】</text><text x="116" y="914" class="t">恢复初始盘面，Combo 归 0</text><text x="116" y="936" class="t">重新执行开局逻辑</text></g>
  <path class="line" d="M250 542 V820"/><text x="260" y="694" class="t">点击【重新开始】</text><path class="line" d="M100 884 H76 V330 H416 V316"/><text x="82" y="790" class="t">回到关卡加载</text>
  <g><rect x="730" y="820" width="254" height="116" rx="14" fill="#eefaf6" stroke="#54a583" stroke-width="2"/><rect x="746" y="836" width="64" height="24" rx="12" fill="#3a8e70"/><text x="762" y="853" class="tag">浮层</text><text x="746" y="888" class="h">普通关卡完成反馈</text><text x="746" y="914" class="t">显示“好梦”，停止局内输入</text></g>
  <path class="line" d="M920 330 V820"/><text x="928" y="590" class="t">普通关卡清空</text><path class="line" d="M984 878 H1034"/>
  <g><rect x="1034" y="820" width="254" height="116" rx="14" fill="#f0f3ff" stroke="#7888bd" stroke-width="2"/><rect x="1050" y="836" width="64" height="24" rx="12" fill="#7888bd"/><text x="1066" y="853" class="tag">状态</text><text x="1050" y="888" class="h">下一关加载</text><text x="1050" y="914" class="t">进入新的盘面展示</text></g>
  <rect x="1056" y="150" width="480" height="584" rx="18" fill="#fffafc" stroke="#e2c7d0"/><text x="1084" y="190" class="h">状态分支与规则</text>
  <g><rect x="1090" y="230" width="410" height="108" rx="14" fill="#fff8e9" stroke="#d9a13d" stroke-width="2"/><rect x="1106" y="246" width="76" height="24" rx="12" fill="#c18a29"/><text x="1118" y="263" class="tag">同屏状态</text><text x="1106" y="296" class="h">受阻即时撞击反馈</text><text x="1106" y="320" class="t">主动与被撞玩具接触当帧同时反馈</text></g><path class="dash" d="M984 260 H1090"/>
  <g><rect x="1090" y="390" width="410" height="128" rx="14" fill="#f3effc" stroke="#8d75bf" stroke-width="2"/><rect x="1106" y="406" width="76" height="24" rx="12" fill="#8067b3"/><text x="1118" y="423" class="tag">同屏状态</text><text x="1106" y="456" class="h">8 秒连击进度条</text><text x="1106" y="482" class="t">数量写在条内；不显示具体秒数</text><text x="1106" y="506" class="t">暂停冻结，继续后从冻结点恢复</text></g><path class="dash" d="M984 294 C1040 320 1040 454 1090 454"/>
  <g><rect x="1090" y="570" width="410" height="126" rx="14" fill="#fff0f4" stroke="#d786a3" stroke-width="2"/><rect x="1106" y="586" width="64" height="24" rx="12" fill="#bd6686"/><text x="1122" y="603" class="tag">外部</text><text x="1106" y="636" class="h">夜晚终关演出 · 章节系统</text><text x="1106" y="662" class="t">完整晚安演出后返回玩具屋</text></g><path class="dash" d="M984 318 C1080 340 1035 620 1090 632"/>
  <rect x="1056" y="968" width="480" height="82" rx="14" fill="#f4f2f6" stroke="#d0c8d3"/><text x="1080" y="998" class="h">图例</text><text x="1080" y="1026" class="t">实线：界面打开 / 返回；虚线：状态或外部系统分支。</text>
