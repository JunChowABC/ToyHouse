<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#655f72"/></marker>
    <style>
      .title{font:700 30px 'Microsoft YaHei',sans-serif;fill:#352f45}.sub{font:400 16px 'Microsoft YaHei',sans-serif;fill:#6f687a}
      .h{font:700 18px 'Microsoft YaHei',sans-serif;fill:#352f45}.t{font:400 15px 'Microsoft YaHei',sans-serif;fill:#514b5e}.tag{font:700 14px 'Microsoft YaHei',sans-serif;fill:#fff}
      .line{stroke:#655f72;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#938aa1;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f7f4f8"/><rect x="28" y="28" width="1544" height="1064" rx="24" fill="#fff" stroke="#d9cfda" stroke-width="2"/>
