<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="800" viewBox="0 0 1700 800" role="img" aria-label="道具说明弹窗 · 入口、确认与返回 v1.2"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style><rect width="100%" height="100%" fill="#faf6f5"/><text x="54" y="60" font-size="34" fill="#674553" text-anchor="start" font-weight="700">道具说明弹窗 · 入口、确认与返回 v1.2</text><text x="54" y="98" font-size="20" fill="#70565f" text-anchor="start" font-weight="400">与主 MDD 第 4.6 节及 UI 第 11 节配套；禁用不扣费，成功生效才消耗库存与本关次数。</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ac8192" stroke-width="1.5"/></marker></defs><rect x="54" y="180" width="280" height="106" rx="18" fill="#fffaf2" stroke="#d8b6c4" stroke-width="2"/><text x="194" y="218" font-size="24" fill="#805464" text-anchor="middle" font-weight="700">局内 · 点击道具</text><text x="194" y="252" font-size="18" fill="#947c86" text-anchor="middle" font-weight="400">满足入口条件，不扣费</text><rect x="434" y="180" width="360" height="106" rx="18" fill="#fffaf2" stroke="#d8b6c4" stroke-width="2"/><text x="614" y="218" font-size="24" fill="#805464" text-anchor="middle" font-weight="700">道具说明弹窗</text><text x="614" y="252" font-size="18" fill="#947c86" text-anchor="middle" font-weight="400">冻结盘面、Combo；不穿透</text><rect x="924" y="180" width="300" height="106" rx="18" fill="#fffaf2" stroke="#d8b6c4" stroke-width="2"/><text x="1074" y="218" font-size="24" fill="#805464" text-anchor="middle" font-weight="700">确认购买 / 使用</text><text x="1074" y="252" font-size="18" fill="#947c86" text-anchor="middle" font-weight="400">先检查上限、目标与余额</text><rect x="1324" y="180" width="320" height="106" rx="18" fill="#fffaf2" stroke="#d8b6c4" stroke-width="2"/><text x="1484" y="218" font-size="24" fill="#805464" text-anchor="middle" font-weight="700">使用流程</text><text x="1484" y="252" font-size="18" fill="#947c86" text-anchor="middle" font-weight="400">洗牌直接执行 / 其他选目标</text><path d="M334 233 H434" fill="none" stroke="#ac8192" stroke-width="2.5" marker-end="url(#arr)"/><path d="M794 233 H924" fill="none" stroke="#ac8192" stroke-width="2.5" marker-end="url(#arr)"/><path d="M1224 233 H1324" fill="none" stroke="#ac8192" stroke-width="2.5" marker-end="url(#arr)"/><rect x="434" y="388" width="360" height="106" rx="18" fill="#fffaf2" stroke="#d8b6c4" stroke-width="2"/><text x="614" y="426" font-size="24" fill="#805464" text-anchor="middle" font-weight="700">关闭 × / Esc</text><text x="614" y="460" font-size="18" fill="#947c86" text-anchor="middle" font-weight="400">回原盘面，不扣任何费用</text><rect x="924" y="388" width="300" height="106" rx="18" fill="#fffaf2" stroke="#d8b6c4" stroke-width="2"/><text x="1074" y="426" font-size="24" fill="#805464" text-anchor="middle" font-weight="700">不可使用</text><text x="1074" y="460" font-size="18" fill="#947c86" text-anchor="middle" font-weight="400">保持弹窗，显示禁用原因</text><rect x="1324" y="388" width="320" height="106" rx="18" fill="#fffaf2" stroke="#d8b6c4" stroke-width="2"/><text x="1484" y="426" font-size="24" fill="#805464" text-anchor="middle" font-weight="700">有效生效</text><text x="1484" y="460" font-size="18" fill="#947c86" text-anchor="middle" font-weight="400">库存 −1，本关次数 +1</text><path d="M614 286 V388" fill="none" stroke="#ac8192" stroke-width="2.5" marker-end="url(#arr)"/><path d="M1074 286 V388" fill="none" stroke="#ac8192" stroke-width="2.5" marker-end="url(#arr)"/><path d="M1484 286 V388" fill="none" stroke="#ac8192" stroke-width="2.5" marker-end="url(#arr)"/><text x="629" y="343" font-size="18" fill="#70565f" text-anchor="start" font-weight="400">关闭</text><text x="1089" y="343" font-size="18" fill="#70565f" text-anchor="start" font-weight="400">校验不通过</text><text x="1499" y="343" font-size="18" fill="#70565f" text-anchor="start" font-weight="400">命中有效目标</text><rect x="54" y="559" width="1590" height="182" rx="20" fill="#f5e9ee" stroke="#e5d1d9" stroke-width="2"/><text x="80" y="601" font-size="25" fill="#805464" text-anchor="start" font-weight="700">扣除与取消边界</text><text x="80" y="641" font-size="22" fill="#70565f" text-anchor="start" font-weight="400">购买成功：扣 100 金币并获得 1 个道具，然后立即进入使用流程。有库存时使用不扣金币。</text><text x="80" y="679" font-size="22" fill="#70565f" text-anchor="start" font-weight="400">取消选目标：不扣库存和次数；若已购买，金币不退，未使用道具保留。无效目标不扣库存或次数。</text><text x="80" y="717" font-size="22" fill="#70565f" text-anchor="start" font-weight="400">同关重开、退出重进、刷新：保留已用次数。首次进入新关各 0/3；金币与库存跨关保留。</text></svg>